name: presence-esisar

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: presence-esisar:latest
    restart: unless-stopped
    environment:
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL:-apprentissage@esisar.grenoble-inp.fr}
      MAIL_SUBJECT: ${MAIL_SUBJECT:-feuille de présence - 5App}
      DIRECT_SEND_ENABLED: ${DIRECT_SEND_ENABLED:-${SMTP_ENABLED:-true}}
      ZIMBRA_URL: ${ZIMBRA_URL:-https://mail-etu.esisar.grenoble-inp.fr}
      # Proxys devant l'app : nginx puis Caddy
      TRUST_PROXY: 2
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100

volumes:
  caddy_data:
  caddy_config:
